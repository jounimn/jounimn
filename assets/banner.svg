<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Nilson Lopes</title>
  <desc id="d">Planning and MIS analyst. Data, BI and automation. A fiber-optic line runs from design in 2021 through networks and operations to data in 2026.</desc>
  <defs>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="lit" x1="0" x2="1"><stop offset="0" stop-color="#ff4a2b" stop-opacity=".15"/><stop offset=".5" stop-color="#ff4a2b"/><stop offset="1" stop-color="#ff9479"/></linearGradient>
    <path id="fiber" d="M40 226 C 260 226, 330 196, 470 196 S 760 232, 900 206 S 1090 168, 1160 168"/>
  </defs>
  <rect width="1200" height="300" fill="#06080b"/>
  <g opacity=".5" stroke="#27303c" stroke-width="1"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/></g>
  <text x="48" y="104" font-family="Georgia, 'Times New Roman', serif" font-size="68" font-weight="300" fill="#ece8e1" letter-spacing="-2">Nilson Lopes</text>
  <text x="50" y="140" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="19" fill="#ff9479">Planning &amp; MIS analyst</text>
  <text x="50" y="168" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="15" fill="#a1aab4">data · BI · automation, grounded in operations</text>
  <use href="#fiber" fill="none" stroke="#27303c" stroke-width="3"/>
  <use href="#fiber" fill="none" stroke="#ff4a2b" stroke-width="10" filter="url(#glow)" opacity=".5"/>
  <use href="#fiber" fill="none" stroke="url(#lit)" stroke-width="3"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#a1aab4" text-anchor="middle">
    <g><circle cx="40" cy="226" r="6" fill="#ff4a2b"/><text x="30" y="256" text-anchor="start">2021 design</text></g>
    <g><circle cx="470" cy="196" r="6" fill="#ff4a2b"/><text x="470" y="226">2023 networks</text></g>
    <g><circle cx="900" cy="206" r="6" fill="#ff4a2b"/><text x="900" y="236">2024 operations</text></g>
    <g><circle cx="1160" cy="168" r="6" fill="#fff0e0"/><text x="1172" y="198" text-anchor="end">2026 data</text></g>
  </g>
  <circle r="5" fill="#fff0e0"><animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#fiber"/></animateMotion></circle>
  <circle r="12" fill="#ff4a2b" opacity=".35" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#fiber"/></animateMotion></circle>
</svg>
